name: weekly-refresh

# One deploy path: any push to main, the weekly schedule, or a manual run.
# On push: validate + deploy only (no API export, no self-commit, no loop).
# On schedule/dispatch: export APIs, rebuild data, commit, then deploy.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install requests

      - name: Export Yandex APIs
        if: github.event_name != 'push'
        env:
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          METRIKA_COUNTER_ID: "50863157"
        run: |
          printf 'YANDEX_CLIENT_ID=%s\nYANDEX_CLIENT_SECRET=%s\nYANDEX_OAUTH_TOKEN=%s\nMETRIKA_COUNTER_ID=50863157\n' \
            "$YANDEX_CLIENT_ID" "$YANDEX_CLIENT_SECRET" "$YANDEX_OAUTH_TOKEN" > .env
          python scripts/export/metrica_api_export.py || true
          python scripts/export/yw_api_export.py || true

      - name: Rebuild site data
        run: |
          python scripts/export/build_site_data.py || true
          python scripts/export/validate_report.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "audit-bot"
          git config user.email "audit-bot@local"
          git add -A
          git diff --cached --quiet || git commit -m "weekly refresh: api data $(date -u +%F)"
          git push || true

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports/cifra18-audit
      - id: deployment
        uses: actions/deploy-pages@v4
